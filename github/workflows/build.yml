name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q *.zip
      - name: Build APK
        working-directory: almiqdad-android
        run: |
          npm install
          npx cap add android
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp www/icons/icon-192.png android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp www/icons/icon-192.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp www/icons/maskable-192.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: almiqdad-android/android/app/build/outputs/apk/debug/app-debug.apk
